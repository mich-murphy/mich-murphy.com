# The characters the social cards can draw: the cards' TTFs keep them (scripts/fonts.py), and a post whose title has
# any other fails the build (layouts/_partials/social-card.html). Latin-1, Latin Extended-A, and some punctuation and
# symbols. Monaspace has many more, like Vietnamese, Greek and Cyrillic: add any a title needs here, then rerun
# `nix develop -c scripts/fonts.py` and commit the fonts it writes
ranges = [
  "0020-007E", "00A0-00AC", "00AE-0148", "014A-017E", "2013-2014", "2018-201A", "201C-201E", "2020-2022", "2026",
  "2039-203A", "20AC", "2122", "2212", "2248", "2260", "2264-2265",
]
