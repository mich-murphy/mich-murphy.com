{{ define "main" }}
<h1>{{ .Title }}</h1>
<content> {{ .Content }} </content>
{{ if ne .Page.Title "Feeds" }}
<hr />
<p class="byline">
  Published on
  <time datetime='{{ .Date.Format "2006-01-02" }}' pubdate
    >{{ .Date.Format (default "2006-01-02" .Site.Params.dateFormat) }}</time
  >
  {{ with .GetTerms "tags" }}with tags {{ range . }}
  <a class="blog-tags" href="{{ .RelPermalink }}">#{{ lower .LinkTitle }}</a>
  {{ end }}{{ end }}
</p>
{{ end }} {{ end }}
