# Basic config
title = "Michael Murphy"
baseURL = "https://mich-murphy.com"
defaultContentLanguage = "en"

# The language tag in each page's <html lang> and each feed's xml:lang
locale = "en-AU"

# Dates are built in the same time zone as CI (TZ in .github/workflows/hugo.yaml)
timeZone = "Australia/Sydney"

# Each post's updated date and commit come from its git history (layouts/_partials/origin.html). CI checks out
# with fetch-depth: 0, so the whole history is there
enableGitInfo = true

# Generate a robots.txt
enableRobotsTXT = true

# Keep the URLs used by the previous Zola site: posts at /<slug>/
[permalinks.page]
  posts = "/:contentbasename/"

# Tags are the only taxonomy, so there is no /categories/
[taxonomies]
  tag = "tags"

# HTML, plus home's search index at /index.json (layouts/home.json.json) and the Atom feeds, at /atom.xml and
# /tags/<tag>/atom.xml where the Zola site served them (layouts/_partials/feed.xml). There's no RSS, so no index.xml
[outputs]
  home = ["html", "atom", "json"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html", "atom"]
  page = ["html"]

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  rel = "alternate"
  noUgly = true

# --minify leaves XML (the feeds and the sitemap) alone: the XML minifier collapses runs of spaces in text, so the
# code in a feed's escaped post content would lose its indentation
[minify]
  disableXML = true

# Syntax highlighting with CSS classes rather than inline styles, and no line
# numbers. For why you'd want to avoid inline styles, see
# https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src#unsafe_inline_styles
[markup]
  [markup.highlight]
    lineNos = false
    noClasses = false

# The Hugo the site is built with, as the flake and the workflow pin it. An older Hugo warns that the project "is not
# compatible with this Hugo version", which fails the build (--panicOnWarning in scripts/build.sh). To update Hugo,
# change this first (README)
[module.hugoVersion]
  min = "0.166.0"

# Hugo may run git, which git info needs, and nothing else, and fetches nothing remote. The defaults also allow Sass,
# Go, Node and PostCSS, which the site doesn't use
[security.exec]
  allow = ["^git$"]
[security.http]
  urls = "none"

[params]
  # The description of the site
  description = "Personal blog of Michael Murphy"

  # The site's source. The footer's build commit, About's source row and each post's colophon link into it
  repo = "https://github.com/mich-murphy/mich-murphy.com"

  # Commits that touch posts without changing what they say. A post's updated date and commit skip them, and so
  # does a commit whose message has a "Bulk: true" trailer, which survives a rebase that changes its hash (the
  # README says when a squash is safe). Any prefix of a hash, 7 characters or more, will do; a shorter entry is
  # ignored (layouts/_partials/origin.html)
  bulkCommits = [
    # feat: migrating website from zola to hugo
    "6f2b864464b2c88626a1f5d186ec87bd2237bdca",
    # content: stop pinning search.nixos.org links to a channel. It only changed link parameters, so its 3 posts
    # keep their old updated dates. Drop this line to count it as an update
    "2a2721c064775048bc021ddd68c4cc3574a501c5",
    # content: turn notes into callouts and point internal links at their files. It has the trailer too
    "26d75ce253e5ce8cb388fdff60ef9197f1e2fdf2",
  ]

  [params.author]
    name = "Michael Murphy"
